    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dołącz do Społeczności | Aurelia Iwanow</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Open+Sans:wght@400;600&family=Reenie+Beanie&family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">

    <!-- WSPÓLNY CSS: nav, footer, resety -->
    <link rel="stylesheet" href="/css/common.css"/>

    <style>
        :root {
            --gold: #fbbc05;
            --cyan: #00e5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            position: relative;
            display: flex;
            flex-direction: column;
            padding-top: 80px;
        }

        /* BACKGROUND */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('/images/bg-kontakt.webp') center center / cover no-repeat;
            z-index: -2;
        }

        .page-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px 16px 80px;
        }

        .form-container {
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 40px 40px;
            border: 1px solid rgba(255,255,255,0.12);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border-radius: 6px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            margin-top: 40px;
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            margin-bottom: 14px;
            text-transform: uppercase;
            color: #fff;
            line-height: 1.3;
        }

        h2 .gold { color: var(--gold); }

        p {
            color: rgba(255,255,255,0.65);
            margin-bottom: 32px;
            font-size: 14px;
            line-height: 1.6;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        form input[type="text"],
        form input[type="email"] {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 2px;
            outline: none;
            transition: all 0.3s ease;
        }

        form input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        form input:focus {
            border-color: var(--cyan);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 1px rgba(0,229,255,0.25);
        }

        .newsletter-consent {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            font-size: 12px;
            line-height: 1.5;
            color: rgba(255,255,255,0.65);
            margin: 6px 0 24px;
        }

        .newsletter-consent input[type="checkbox"] {
            width: 16px;
            height: 16px;
            min-width: 16px;
            margin-top: 2px;
            accent-color: var(--cyan);
        }

        form button {
            width: 100%;
            padding: 18px;
            background: var(--gold);
            color: #000;
            border: 1px solid var(--gold);
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        form button:hover {
            background: transparent;
            color: var(--gold);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        /* =========================
           MAILERLITE RESET (CLEAN)
           ========================= */
        .ml-embedded { width: 100%; margin-top: 20px; }

        #mlb2-42588484,
        #mlb2-42588484 * {
            background: transparent !important;
            box-shadow: none !important;
        }

        .ml-form-embedWrapper {
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
        }

        .ml-form-embedBody { background: transparent !important; padding: 0 !important; }

        .ml-form-embedBody input {
            width: 100% !important;
            padding: 16px !important;
            margin-bottom: 12px !important;
            background: rgba(255,255,255,0.08) !important;
            border: 1px solid rgba(255,255,255,0.12) !important;
            color: #fff !important;
            font-family: 'Open Sans', sans-serif !important;
            font-size: 15px !important;
            border-radius: 2px !important;
        }

        .ml-form-embedBody input:focus {
            border-color: var(--cyan) !important;
            box-shadow: 0 0 0 1px rgba(0,229,255,0.25) !important;
            outline: none !important;
        }

        .ml-form-embedSubmit button {
            width: 100% !important;
            padding: 18px !important;
            background: var(--gold) !important;
            color: #000 !important;
            border: none !important;
            border-radius: 2px !important;
            font-family: 'Montserrat', sans-serif !important;
            font-weight: 800 !important;
            text-transform: uppercase !important;
            letter-spacing: 2px !important;
            cursor: pointer !important;
        }

        .ml-form-embedSubmit button:hover {
            background: transparent !important;
            border: 1px solid var(--gold) !important;
            color: var(--gold) !important;
        }

        /* =========================
           RESPONSIVE / MOBILE
           ========================= */

        @media (max-width: 600px) {
            body { padding-top: 64px; }

            .page-content { padding: 12px 12px 60px; }

            .form-container {
                padding: 32px 22px;
                border-radius: 8px;
                margin-top: 60px;
            }

            h2 { font-size: 19px; letter-spacing: -0.3px; }

            p { font-size: 13.5px; margin-bottom: 26px; }

            form input[type="text"],
            form input[type="email"] {
                padding: 15px 14px;
                font-size: 12px;
                letter-spacing: 1px;
            }

            form button { padding: 16px; font-size: 12px; letter-spacing: 1.5px; }

            .newsletter-consent { font-size: 11.5px; }
        }

        @media (max-width: 360px) {
            .form-container { padding: 26px 16px; }
            h2 { font-size: 17px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
        .br-mobile,
.br-desktop {
    display: none;
}

@media (max-width: 600px) {
    .br-mobile { display: inline; }
}

@media (min-width: 601px) {
    .br-desktop { display: inline; }
}
    </style>
</head>

    <div class="form-container">

        <h2>
            COTYGODNIOWA <span class="gold"> DAWKA PALIWA</span>
        </h2>
        <p>

        </p>

            </label>

            <input type="hidden" name="ml-submit" value="1">
            <input type="hidden" name="anticsrf" value="true">

            <button type="submit">
                DOŁĄCZ TERAZ
            </button>
        </form>

        <a href="/" class="back-link">
            ← powrót do strony głównej
        </a>

    </div>
</main>

  {% include footer.html %}
