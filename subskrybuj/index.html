        * { margin: 0; padding: 0; box-sizing: border-box; }
       body {
    min-height: 100vh;
    margin: 0;
    font-family:'Montserrat',sans-serif;

    color: #fff;
    position: relative;
    display: flex;
    min-height: 100vh;

/* BACKGROUND (TA SAMA LOGIKA CO KONTAKT) */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('/images/bg-kontakt.png') center center / cover no-repeat;
    z-index: -2;
}

/* OVERLAY (IDENTYCZNY MOOD) */

    
       .form-container {
    background: rgba(10, 10, 10, 0.75);
    backdrop-filter: blur(18px);
    padding: 35px 40px;
    border: 1px solid rgba(255,255,255,0.12);
    width: 90%;
    max-width: 520px;
    text-align: center;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transition: all 0.3s ease;
    max-height: fit-content;
    display: inline-block;
    margin-top:60px;
}

        h2 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -1px;
    margin-bottom: 10px;
    text-transform: uppercase;
    color: #fff;
}

p {
    color: rgba(255,255,255,0.65);
    margin-bottom: 40px;
    font-size: 15px;
    line-height: 1.6;
}

     input {
    width: 100%;
    padding: 18px;
    margin-bottom: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: white;
    font-size: 15px;
    border-radius: 2px;
    transition: all 0.3s ease;
    font-family: 'Montserrat', sans-serif;
    text-transform: uppercase;
    letter-spacing: 2px;
}

input:focus {
    outline: none;
    border-color: #00e5ff;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 0 1px rgba(0,229,255,0.25);
}
       button {
    width: 100%;
    padding: 18px;
    background: #fbbc05;
    color: #000;
    border: none;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 2px;
}

button:hover {
    background: transparent;
    border: 1px solid #fbbc05;
    color: #fbbc05;
}
        
        .back-link {
    display: block;
    margin-top: 25px;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: color 0.3s;
}

.back-link:hover {
    color: #fbbc05;
}

.ml-embedded {margin-top: 20px;
}

/* lekka personalizacja jeśli MailerLite pozwala */
.ml-embedded iframe {
    border-radius: 6px;
}  

/* =========================
   MAILERLITE RESET (CLEAN)
   ========================= */

.ml-embedded {
    width: 100%;
}

/* usuwa tło i boxy MailerLite */
#mlb2-42588484,
#mlb2-42588484 * {
    background: transparent !important;
    box-shadow: none !important;
}

/* wrapper formularza */
.ml-form-embedWrapper {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
}

/* usuwa wewnętrzne paddingi */
.ml-form-embedBody {
    background: transparent !important;
    padding: 0 !important;
}

/* input styling → dopasowanie do Twojego designu */
.ml-form-embedBody input {
    width: 100% !important;
    padding: 18px !important;
    margin-bottom: 12px !important;

    background: rgba(255,255,255,0.08) !important;
    border: 1px solid rgba(255,255,255,0.12) !important;
    color: #fff !important;

    font-family: 'Open Sans', sans-serif !important;
    font-size: 15px !important;
    border-radius: 2px !important;
}

/* focus jak u Ciebie */
.ml-form-embedBody input:focus {
    border-color: #00e5ff !important;
    box-shadow: 0 0 0 1px rgba(0,229,255,0.25) !important;
    outline: none !important;
}

/* button = Twój styl (gold) */
.ml-form-embedSubmit button {
    width: 100% !important;

    background: #fbbc05 !important;
    color: #000 !important;

    border: none !important;
    border-radius: 2px !important;

    font-family: 'Montserrat', sans-serif !important;
    font-weight: 800 !important;
    text-transform: uppercase !important;
    letter-spacing: 2px !important;

    cursor: pointer !important;
}

/* hover jak u Ciebie */
.ml-form-embedSubmit button:hover {
    background: transparent !important;
    border: 1px solid #fbbc05 !important;
    color: #fbbc05 !important;
}
   .newsletter-consent{

        .form-container input {

.form-container button {

        .newsletter-consent input[type="checkbox"] {

}
        .newsletter-consent {

    gap: 10px;
    font-size: 12px;
    line-height: 1.4;
    align-items: center;
}

.newsletter-consent input[type="checkbox"] {
    width: 16px;

        .newsletter-consent input[type="checkbox"] {

}

/* INPUTY (żeby wyglądały jak na stronie kontakt) */
form input[type="email"],
form input[type="text"] {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
  font-size: 0.72rem;

  letter-spacing: 2px;

}

form input:focus {
  border-color: var(--cyan);
  background: rgba(51,228,224,0.04);
}

/* BUTTON */
form button {
  background: var(--gold);

  font-family: 'Montserrat', sans-serif;

form button:hover {

/* CHECKBOX (żeby był mały i równo z tekstem) */
.newsletter-consent {

.newsletter-consent input[type="checkbox"] {
