<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kontakt – Aurelia Iwanow</title>
<link rel="icon" type="image/png" href="/images/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Reenie+Beanie&family=Barlow+Condensed:wght@300;400;700;900&family=Barlow:wght@300;400;500&family=Montserrat:wght@100;300;400;500;700;900&display=swap" rel="stylesheet"/>

<!-- WSPÓLNY CSS: nav, footer, resety -->
<link rel="stylesheet" href="/css/common.css"/>

<style>
/* Style specyficzne TYLKO dla strony kontakt */

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url('/images/bg-kontakt.png') center center / cover no-repeat;
  z-index: -2;
}

.contact-hero{
  position:relative;
  min-height:100vh;
  display:grid;
  grid-template-columns:1fr 1fr;
  overflow:hidden;
  padding-top:80px;
}

.hero-photo{
  position:relative;
  overflow:hidden;
  min-height:500px;
}

.hero-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  filter:grayscale(20%);
}

.hero-photo-placeholder{
  width:100%;height:100%;
  background:linear-gradient(135deg,#111 0%,#1a1a2e 100%);
  display:flex;align-items:center;justify-content:center;
  min-height:500px;
}

.hero-text{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:80px 60px 60px 40px;
  position:relative;
  z-index:2;
}

.hero-connect{
  font-family:'Montserrat',sans-serif;
  font-weight:300;
  font-size:clamp(1.2rem,3vw,2rem);
  letter-spacing:0.05em;
  color:rgba(255,255,255,0.8);
  margin-bottom:4px;
  animation:fadeUp 0.6s ease both;
}

.hero-name{
  font-family:'Antonio',sans-serif;
  font-weight:700;
  font-size:clamp(4rem,12vw,9rem);
  letter-spacing:-0.04em;
  line-height:0.85;
  color:#fff;
  text-transform:uppercase;
  animation:fadeUp 0.6s 0.1s ease both;
}

.hero-desc{
  font-size:0.85rem;
  font-weight:300;
  color:rgba(255,255,255,0.55);
  line-height:1.7;
  margin-top:20px;
  max-width:380px;
  animation:fadeUp 0.6s 0.2s ease both;
}

.inquiry-section{
  background:#0a0a0f;
  padding:60px 40px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  max-width:900px;
  margin:0 auto;
  width:100%;
}

.inquiry-btn{
  font-family:'Montserrat',sans-serif;
  font-weight:600;
  font-size:0.72rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:#fff;
  background:none;
  border:1px solid rgba(255,255,255,0.25);
  padding:18px 24px;
  cursor:pointer;
  text-align:left;
  position:relative;
  transition:border-color .25s, color .25s, background .25s;
  display:flex;
  align-items:center;
  gap:10px;
}

.inquiry-btn::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:transparent;
  transition:background .25s;
}

.inquiry-btn:hover,
.inquiry-btn.active{
  border-color:var(--cyan);
  color:var(--cyan);
  background:rgba(51,228,224,0.05);
}

.inquiry-btn:hover::before,
.inquiry-btn.active::before{
  background:var(--cyan);
}

.form-section{
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.3);
  margin:140px auto 120px;
  max-width:900px;
  width:calc(100% - 80px);
  padding:48px;
}

.form-intro{
  font-size:0.88rem;
  font-weight:400;
  color:rgba(255,255,255,0.92);
  line-height:1.75;
  letter-spacing:0.4px;
  text-align:center;
  max-width:500px;
  margin:0 auto 36px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.form-field{
  position:relative;
}

.form-field.full{
  grid-column:1/-1;
}

.form-input{
  width:100%;
  padding:14px 16px;
  background:rgba(255,255,255,0.2);
  border:1px solid rgba(255,255,255,0.12);
  color:#fff;
  font-family:'Montserrat',sans-serif;
  font-size:0.72rem;
  font-weight:500;
  letter-spacing:2px;
  text-transform:uppercase;
  outline:none;
  transition:border-color .2s, background .2s;
}

.form-input::placeholder{
  color:rgba(255,255,255,0.45);
  letter-spacing:2px;
}

.form-input:focus{
  border-color:var(--cyan);
  background:rgba(51,228,224,0.04);
}

textarea.form-input{
  min-height:160px;
  resize:vertical;
  text-transform:none;
  letter-spacing:0.5px;
  font-size:0.8rem;
}

.form-submit{
  margin-top:24px;
  text-align:center;
}

.btn-send{
  font-family:'Montserrat',sans-serif;
  font-weight:700;
  font-size:0.78rem;
  letter-spacing:3px;
  text-transform:uppercase;
  background:var(--gold);
  color:#000;
  border:2px solid transparent;
  padding:16px 60px;
  cursor:pointer;
  transition:background 0.4s ease, border-color 0.4s ease, color 0.4s ease, transform 0.15s;
}
.btn-send:hover{
  background:transparent;
  border-color:var(--gold);
  color:var(--gold);
  transform:scale(1.02);
}

.success-msg{
  display:none;
  text-align:center;
  padding:48px 24px;
  animation:fadeUp 0.5s ease both;
}
.success-msg.show{display:block}
.success-icon{font-size:3rem;margin-bottom:16px}
.success-title{
  font-family:'Antonio',sans-serif;
  font-size:2.5rem;
  letter-spacing:0.05em;
  color:var(--cyan);
  margin-bottom:12px;
}
.success-text{
  font-size:0.85rem;
  font-weight:300;
  color:rgba(255,255,255,0.5);
}

.social-strip{
  padding:40px 24px;
  text-align:center;
}

.social-strip p{
  font-size:0.68rem;
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.8);
  margin-bottom:20px;
}

.social-icons{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:16px;
}

.social-icon{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;
  text-decoration:none;
  transition:border-color .2s, transform .2s;
}
.social-icon:hover{transform:scale(1.1)}
.social-icon svg{
  width:18px;
  height:18px;
  fill:rgba(255,255,255,0.8);
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* =========================================================
   MOBILE — rebuilt for phones and small tablets
   Goals: no accidental iOS zoom on inputs, full-width tap
   targets, breathing room that matches a shorter viewport,
   and a hero/form that reads top-to-bottom cleanly.
   ========================================================= */

@media (max-width: 860px){
  .contact-hero{
    grid-template-columns:1fr;
    min-height:auto;
    padding-top:64px;
  }

  .hero-photo,
  .hero-photo-placeholder{
    min-height:60vh;
  }

  .hero-text{
    padding:40px 24px 48px;
    text-align:center;
    align-items:center;
  }

  .hero-desc{
    max-width:100%;
    margin-left:auto;
    margin-right:auto;
  }

  .inquiry-section{
    grid-template-columns:1fr;
    padding:32px 20px;
    gap:10px;
  }

  .inquiry-btn{
    padding:16px 18px;
    font-size:0.7rem;
  }
}

@media (max-width: 640px){
  .form-section{
    /* the desktop margin (140/120px) reads huge once the
       viewport itself is only ~700-800px tall — bring it
       down so the form isn't buried in empty space */
    margin:120px auto 64px;
    width:calc(100% - 42px);
    padding:28px 20px 32px;
    border-radius:2px;
  }

  .form-intro{
    font-size:0.82rem;
    line-height:1.6;
    margin-bottom:28px;
  }

  .form-grid{
    grid-template-columns:1fr;
    gap:12px;
  }

  .form-input{
    /* 16px is the iOS Safari threshold below which focusing
       a field triggers an automatic zoom — keep every input
       at or above it on mobile */
    font-size:12px;
    letter-spacing:1px;
    padding:15px 16px;
  }

  .form-input::placeholder{
    letter-spacing:1px;
  }

  textarea.form-input{
    min-height:130px;
    font-size:16px;
  }

  .form-submit{
    margin-top:20px;
  }

  .btn-send{
    width:100%;
    padding:17px 24px;
    font-size:0.75rem;
    letter-spacing:2.5px;
  }
  /* tap should feel immediate on touch, not rely on :hover */
  .btn-send:active{
    background:transparent;
    border-color:var(--gold);
    color:var(--gold);
    transform:scale(0.98);
  }

  .success-msg{
    padding:36px 16px;
  }
  .success-icon{font-size:2.4rem;margin-bottom:12px}
  .success-title{font-size:1.9rem}
  .success-text{font-size:0.8rem}

  .social-strip{
    padding:32px 20px;
  }
  .social-strip p{
    font-size:0.62rem;
    letter-spacing:2.5px;
    margin-bottom:16px;
  }
  .social-icons{
    gap:20px;
  }
  .social-icon{
    width:44px;height:44px; /* comfortable 44px touch target */
  }
}

@media (max-width: 380px){
  .form-section{
    width:calc(100% - 20px);
    padding:24px 16px 28px;
  }
  .hero-name{
    font-size:clamp(3rem,15vw,5rem);
  }
}
</style>
</head>
<body>

<!-- NAV zostanie wstrzyknięty tutaj przez common.js -->
<div id="nav-placeholder"></div>

<!-- FORM -->
<div class="form-section">
<p class="form-intro">Jeśli masz pytania, czekam na wiadomość od Ciebie!</p>

<form id="contactForm" action="https://formspree.io/f/xdajwdla" method="POST">

    <div class="form-grid">
      <div class="form-field">
        <input type="text" name="imie" class="form-input" placeholder="Imię" required autocomplete="given-name"/>
      </div>
      <div class="form-field">
        <input type="text" name="nazwisko" class="form-input" placeholder="Nazwisko" autocomplete="family-name"/>
      </div>
      <div class="form-field">
        <input type="email" name="email" class="form-input" placeholder="Adres e-mail" required autocomplete="email"/>
      </div>
      <div class="form-field">
        <input type="text" name="temat" class="form-input" placeholder="Temat"/>
      </div>
      <div class="form-field full">
        <textarea name="wiadomosc" class="form-input" placeholder="Twoja wiadomość..." required></textarea>
      </div>
    </div>

    <div class="form-submit">
      <button type="submit" class="btn-send">WYŚLIJ WIADOMOŚĆ</button>
    </div>
  </form>
  <div class="success-msg" id="successMsg">
    <div class="success-icon">✅</div>
    <p class="success-title">WIADOMOŚĆ WYSŁANA!</p>
    <p class="success-text">Dziękuję za kontakt. Odezwę się wkrótce!</p>
  </div>
</div>

<!-- FOOTER zostanie wstrzyknięty tutaj przez common.js -->
<div id="footer-placeholder"></div>

<!-- WSPÓLNY JS: wczytuje nav/footer i obsługuje menu -->
<script src="/js/common.js"></script>

</body>
</html>
